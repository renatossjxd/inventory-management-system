name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore InventoryManagement.slnx

      - name: Build
        run: dotnet build InventoryManagement.slnx --configuration Release --no-restore

      - name: Validate Azure infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Run tests
        run: >-
          dotnet test InventoryManagement.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Check vulnerable dependencies
        shell: bash
        run: |
          dotnet list InventoryManagement.slnx package --vulnerable --include-transitive | tee vulnerability-report.txt
          if grep -q "has the following vulnerable packages" vulnerability-report.txt; then
            echo "Vulnerable dependencies were detected."
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SQL_PASSWORD: Integration_2026_Strong!
      JWT_KEY: integration-jwt-key-2026-with-at-least-32-characters
      INTEGRATION_ADMIN_EMAIL: integration.admin@inventory.local
      INTEGRATION_ADMIN_PASSWORD: Integration_2026!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for response assertions
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Start API, SQL Server and Azurite
        run: docker compose up --detach --build

      - name: Run end-to-end API test
        run: bash tests/integration/api-smoke-test.sh

      - name: Capture container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes
