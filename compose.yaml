services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InventoryDb: Server=sqlserver,1433;Database=InventoryManagement;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      Jwt__Issuer: InventoryManagement.Api
      Jwt__Audience: InventoryManagement.Client
      Jwt__Key: ${JWT_KEY}
      Database__MigrateOnStartup: "true"
      BlobStorage__ConnectionString: DefaultEndpointsProtocol=http;AccountName=inventory;AccountKey=aW52ZW50b3J5LWxvY2FsLWRldmVsb3BtZW50LWtleS0yMDI2LW11c3QtYmUtMzItYnl0ZXM=;BlobEndpoint=http://azurite:10000/inventory;
      BlobStorage__ContainerName: product-images
      BlobStorage__PublicBaseUrl: http://localhost:10000/inventory/product-images
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    environment:
      AZURITE_ACCOUNTS: inventory:aW52ZW50b3J5LWxvY2FsLWRldmVsb3BtZW50LWtleS0yMDI2LW11c3QtYmUtMzItYnl0ZXM=
    ports:
      - "10000:10000"
    volumes:
      - blob-data:/data

volumes:
  sql-data:
  blob-data:
